<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydenlyne</title>
    <meta name="description" content="Global marine environmental, geophysical, geotechnical, and offshore energy survey specialist search and deployment." />
    <meta property="og:title" content="Hydenlyne" />
    <meta property="og:description" content="Global marine environmental, geophysical, geotechnical, and offshore energy survey specialist search and deployment." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const theme = localStorage.getItem('hydenlyne_theme_preference');
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="h-full bg-canvas text-primary antialiased font-sans selection:bg-action selection:text-on-action">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
